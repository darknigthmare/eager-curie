name: Alien Base snapshot integrity
on:
  pull_request:
  push:
    branches:
      - main
      - feat/alien-base-unified-codex-20261101
permissions:
  contents: read
jobs:
  alien-base:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntaxe JS de l'interface archives
        run: node --check src/alien-base-library.js
      - name: Validation cohérence jeu et snapshots v1/v2
        run: node tools/qa-alien-base.cjs
      - name: Comportement de l'interface archives (DOM simulé)
        run: node tools/qa-alien-base-ui.cjs
